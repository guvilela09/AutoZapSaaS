services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: autozap-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_SA_PASSWORD:?defina SQL_SA_PASSWORD no .env}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - autozap-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: autozap-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?defina RABBITMQ_USER no .env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - autozap-network

  evolution-api:
    # Repositorio oficial atual. O antigo atendai/evolution-api saiu do ar.
    # Versao fixada de proposito: 'latest' ja quebrou o ambiente uma vez.
    image: evoapicloud/evolution-api:v2.3.7
    container_name: autozap-evolution
    depends_on:
      - rabbitmq
      - postgres
    environment:
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?defina EVOLUTION_API_KEY no .env}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/evolution
      - RABBITMQ_ENABLED=true
      - RABBITMQ_URI=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - WEBSOCKET_ENABLED=true
    ports:
      # 8081 no host: a 8080 pode ter outra Evolution rodando fora deste compose.
      # Esta instancia e exclusiva do AutoZap, que cria e remove sessoes sozinho.
      - "8081:8080"
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - autozap-network

  postgres:
    image: postgres:16-alpine
    container_name: autozap-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      - POSTGRES_DB=evolution
    ports:
      # 5433 no host para nao colidir com um Postgres instalado na maquina.
      # Dentro da rede do compose os servicos seguem falando na 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - autozap-network

  api:
    image: autozap-saas-api
    build:
      context: .
      dockerfile: Dockerfile
    # A imagem e local: sem isso o compose tenta puxar do Docker Hub e falha.
    pull_policy: build
    container_name: autozap-api
    depends_on:
      - sqlserver
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=AutoZapSaaS_Db;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;
      - Jwt__Secret=${JWT_SECRET:?defina JWT_SECRET no .env}
      - App__PublicBaseUrl=${PUBLIC_BASE_URL:-http://localhost:5000}
      - EvolutionApi__BaseUrl=http://evolution-api:8080
      - EvolutionApi__ApiKey=${EVOLUTION_API_KEY}
    ports:
      # O runtime .NET 8+ escuta na 8080 dentro do container, nao na 80.
      - "5000:8080"
    networks:
      - autozap-network

volumes:
  sqlserver_data:
  postgres_data:
  evolution_instances:

networks:
  autozap-network:
    driver: bridge
